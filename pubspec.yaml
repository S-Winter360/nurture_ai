name: nurture_ai
description: A modern healthcare application for maternal and child care.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_timezone: ^3.0.1
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  path_provider: ^2.1.3
  crypto: ^3.0.3
  # --- SPRINT 8C DEPENDENCY ---
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/clinical/